# ── General ──
seed: 9999

# ── Data ──
image_size: 224
resize: 256
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

# ── DataLoader ──
batch_size: 32
num_workers: 4

# ── ViT Architecture ──
in_channels: 3
patch_size: 16
embedding_dim: 256
num_encoders: 6
num_heads: 8
d_ff_scale: 4
num_classes: 3

# ── Dropout ──
input_dropout: 0.0
attention_dropout: 0.0
ff_dropout: 0.1

# ── Training ──
learning_rate: 0.001
epochs: 10
